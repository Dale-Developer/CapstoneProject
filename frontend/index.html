<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- %VITE_APP_NAME% is substituted by Vite at startup from frontend/.env,
         so the tab title follows the same rename as everything else. -->
    <title>%VITE_APP_NAME%</title>
    <meta name="description" content="%VITE_APP_NAME% automated assessment" />

    <!-- Installed-app appearance. iOS ignores the web manifest and reads
         these tags instead, which is why the icon and title are declared
         twice. -->
    <meta name="theme-color" content="%VITE_APP_THEME_COLOR%" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_SHORT_NAME%" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
